name: 功能建议
description: 提议一个新功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在做什么事的时候需要这个能力？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      description: docs/SCOPE.md 列入了明确排除项（许可激活/反盗版、遥测、自动更新、云图床、账号系统、pandoc 外部转换）
      options:
        - label: 我已阅读 SCOPE.md，此建议不在排除项内
